# Build, scan, sign and publish the site's two environment images (platform template
# build-image.yml, with a matrix over staging/production instead of web/api).
# The root Dockerfile builds ONE image running both the Next.js web app and the Nitro
# API. NEXT_PUBLIC_* values and CORS_ORIGIN are baked in at build time, so each deploy
# environment gets its own image. Both are built from main and signed. The file name is
# part of the signing identity Kyverno accepts.
# - Only main publishes; staging's image is built from the same commit with STAGING_-
#   prefixed secrets (the deployed configuration is what differs, not the source).
# - Runs on solstice's ephemeral runners: a fresh container per job, deleted afterwards.
name: build-image
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: build-image-${{ github.ref }}
  # Never cancel main: a cancel between push and sign would leave an unsigned image in GHCR.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
defaults:
  run:
    shell: bash
env:
  CONTEXT: .
  DOCKERFILE: Dockerfile
jobs:
  check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      # Public repository: pull-request jobs run on GitHub's hosted runners (free for public
      # repositories), never on solstice, where a fork's pull request would run its code.
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1  # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1
      - name: Install trivy (pinned, checksum-verified; the solstice builder's version)
        run: |
          curl -sfL -o /tmp/trivy.tgz https://github.com/aquasecurity/trivy/releases/download/v0.75.0/trivy_0.75.0_Linux-64bit.tar.gz
          echo "c6e65abddb348e25f10549df887045629cf28cc72453cd1c63acb717316b3f3f  /tmp/trivy.tgz" | sha256sum -c -
          sudo tar -xzf /tmp/trivy.tgz -C /usr/local/bin trivy
      - name: Build both platforms (no push)
        run: docker buildx build --platform linux/amd64,linux/arm64 -f "$DOCKERFILE" "$CONTEXT"
      - name: Scan the amd64 image
        run: |
          docker buildx build --platform linux/amd64 --load -t "scan-$GITHUB_RUN_ID" -f "$DOCKERFILE" "$CONTEXT"
          trivy image --exit-code 1 --severity CRITICAL --ignore-unfixed --no-progress "scan-$GITHUB_RUN_ID"
      - name: Clean up
        if: always()
        run: |
          docker image rm "scan-$GITHUB_RUN_ID" 2>/dev/null || true
          docker builder prune -af --filter until=24h >/dev/null 2>&1 || true

  test:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    container:
      image: node:22-alpine@sha256:0a7108bf6c7bf5de370ffb1a3ed6be93d405b43ff159f681a8d18c0e2bc2e402
    defaults:
      run:
        shell: sh   # node:22-alpine has no bash (the workflow default)
    services:
      postgres:
        image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
        env:
          POSTGRES_HOST_AUTH_METHOD: trust   # throwaway service container, reachable only from this job
          POSTGRES_DB: test
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U postgres"
          --health-interval 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Enable Corepack
        run: corepack enable
      - name: Install dependencies
        run: yarn install --immutable --mode=skip-build   # no lifecycle scripts
      - name: Typecheck
        run: yarn typecheck
      - name: Test
        run: yarn test
        env:
          TEST_DATABASE_URL: postgres://postgres@postgres:5432/test

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, solstice, builder]
    # The production build args live in this GitHub environment.
    environment: "Production VPS"
    strategy:
      fail-fast: false
      matrix:
        # Staging's build args: secret STAGING_NEXT_PUBLIC_API_URL and variable STAGING_CORS_ORIGIN
        # (https://varoai.solstice.krakowski.cloud), set 2026-10-21.
        environment: [staging, production]
    permissions:
      contents: read
      packages: write
      id-token: write
    env:
      IMAGE: ghcr.io/martinkrakowski/panelcraft-${{ matrix.environment }}
      # Both environments' build args under distinct names: production uses the same
      # secret names as the former droplet deploy; staging the same names with a STAGING_ prefix.
      # The right set is picked in the first run step below, strictly per environment:
      # an "&& ||" expression here would fall through to the staging value whenever a
      # production secret is empty, silently baking staging config into the production
      # image.
      PROD_NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
      STAGING_NEXT_PUBLIC_API_URL: ${{ secrets.STAGING_NEXT_PUBLIC_API_URL }}
      # The CORS origin is public; production's is the value deploy.yml has always used.
      PROD_CORS_ORIGIN: https://varoai.martinkrakowski.com
      STAGING_CORS_ORIGIN: ${{ vars.STAGING_CORS_ORIGIN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Select this environment's build args
        # Pick exactly one environment's values and fail on any empty one, so an
        # image can never inherit the other environment's configuration.
        run: |
          case "${{ matrix.environment }}" in
            production) env_prefix=PROD ;;
            staging) env_prefix=STAGING ;;
            *)
              echo "::error::Unknown environment '${{ matrix.environment }}' (expected staging or production)"
              exit 1
              ;;
          esac
          missing=""
          for name in NEXT_PUBLIC_API_URL CORS_ORIGIN; do
            ref="${env_prefix}_${name}"
            if [ -z "${!ref}" ]; then
              missing="$missing $ref"
            fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Refusing to build the ${{ matrix.environment }} image; empty build-arg variable(s):${missing}"
            exit 1
          fi
          for name in NEXT_PUBLIC_API_URL CORS_ORIGIN; do
            ref="${env_prefix}_${name}"
            printf '%s=%s\n' "$name" "${!ref}" >> "$GITHUB_ENV"
          done
      - name: Keep the registry login inside this job's temp directory
        run: echo "DOCKER_CONFIG=$RUNNER_TEMP/docker" >> "$GITHUB_ENV"
      - name: Log in to GHCR with this job's own token
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Build and push both platforms
        run: |
          docker buildx build --platform linux/amd64,linux/arm64 --push --provenance=mode=max \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --build-arg NEXT_PUBLIC_API_URL="$NEXT_PUBLIC_API_URL" \
            --build-arg CORS_ORIGIN="$CORS_ORIGIN" \
            -t "$IMAGE:sha-${GITHUB_SHA::12}" --metadata-file "$RUNNER_TEMP/meta.json" \
            -f "$DOCKERFILE" "$CONTEXT"
          echo "DIGEST=$(jq -r '."containerimage.digest"' "$RUNNER_TEMP/meta.json")" >> "$GITHUB_ENV"
      - name: Scan the pushed image, both platforms
        run: |
          for p in linux/amd64 linux/arm64; do
            trivy image --platform "$p" --exit-code 1 --severity CRITICAL --ignore-unfixed --no-progress "$IMAGE@$DIGEST"
          done
      - name: SBOM, signature and SBOM attestation (keyless, this workflow's identity)
        run: |
          syft "$IMAGE@$DIGEST" -o spdx-json > "$RUNNER_TEMP/sbom.spdx.json"
          # Classic signature format until Kyverno 1.19's verification of cosign 3 bundles is proved.
          cosign sign --yes --new-bundle-format=false --use-signing-config=false "$IMAGE@$DIGEST"
          cosign attest --yes --new-bundle-format=false --use-signing-config=false --type spdxjson \
            --predicate "$RUNNER_TEMP/sbom.spdx.json" "$IMAGE@$DIGEST"
      - name: Record the digest for the promotion pull request
        run: |
          echo "Promote with a platform pull request (${{ matrix.environment }}, $GITHUB_REF_NAME): \`$IMAGE@$DIGEST\`" >> "$GITHUB_STEP_SUMMARY"
      - name: Log out and clean up
        if: always()
        run: |
          docker logout ghcr.io >/dev/null 2>&1 || true
          rm -rf "$DOCKER_CONFIG"
          docker builder prune -af --filter until=24h >/dev/null 2>&1 || true
